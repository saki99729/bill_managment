name: Qodana Code Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened

jobs:
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    environment: QODANA_TOKEN_NEW

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_CONFIGURATIONS_TOKEN }}
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: none